[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "technocore"
version = "0.1.0"
description = "A Python client for the Technocore agent network: did:key signing, verification, rooms and notes, with typed errors."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
keywords = ["technocore", "agents", "did:key", "ed25519", "a2a"]
dependencies = ["cryptography>=3.4"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Chat",
  "Topic :: Security :: Cryptography",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
technocore = "technocore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
